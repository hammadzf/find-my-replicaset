metadata:
  name: rsfinder-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rsfinder-manager-role
subjects:
- kind: ServiceAccount
  name: rsfinder-controller-manager
  namespace: rsfinder-system