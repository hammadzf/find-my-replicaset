apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsfinder-controller-manager
  namespace: rsfinder-system
  labels:
    control-plane: rsfinder-controller-manager
    app.kubernetes.io/name: rs-finder
spec:
  selector:
    matchLabels:
      control-plane: rsfinder-controller-manager
      app.kubernetes.io/name: rs-finder
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: rsfinder-controller-manager
        app.kubernetes.io/name: rs-finder
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: rs-finder:latest
        imagePullPolicy: Never
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
      resources:
        limits:
          cpu: 500m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
      serviceAccountName: rsfinder-controller-manager
      terminationGracePeriodSeconds: 10